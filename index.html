<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Hospital Appointment</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>🏥 Smart Hospital</h1><p>Online Appointment Management System</p></header>

<main>
<section id="auth" class="card">
<h2>Login</h2>
<input id="email" placeholder="Email" value="patient@hospital.com">
<input id="password" type="password" placeholder="Password" value="Patient@123">
<button onclick="login()">Login</button>
<p id="authMsg"></p>
<details><summary>New patient registration</summary>
<input id="regName" placeholder="Name">
<input id="regEmail" placeholder="Email">
<input id="regPass" type="password" placeholder="Password">
<button onclick="register()">Register</button>
</details>
</section>

<section id="app" style="display:none">
<div class="toolbar">
<span id="welcome"></span>
<button onclick="logout()">Logout</button>
</div>

<div class="grid">
<section class="card">
<h2>Find Doctor</h2>
<input id="specialization" placeholder="Specialization (optional)">
<button onclick="loadDoctors()">Search</button>
<div id="doctors"></div>
</section>

<section class="card">
<h2>Book Appointment</h2>
<input id="doctorId" type="number" placeholder="Doctor ID">
<input id="date" type="date">
<input id="time" type="time">
<input id="reason" placeholder="Reason">
<button onclick="book()">Book Appointment</button>
<p id="bookMsg"></p>
</section>
</div>

<section class="card">
<h2>My Appointments</h2>
<button onclick="loadAppointments()">Refresh</button>
<div id="appointments"></div>
</section>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
